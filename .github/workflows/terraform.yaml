name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: parrent module

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "84e19822-5930-49b6-b3d6-954e7c9b524a" \
            --password "uPC8Q~RYmG47U03D0FRyLaVl13cA4ui4NY0bsc~H" \
            --tenant "0566e7c0-ce72-4d83-a4b0-a667ea532764"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "0e3402ea-b30c-409a-9bbe-2dac4d43e202"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: parrent module

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "84e19822-5930-49b6-b3d6-954e7c9b524a" \
            --password "uPC8Q~RYmG47U03D0FRyLaVl13cA4ui4NY0bsc~H" \
            --tenant "0566e7c0-ce72-4d83-a4b0-a667ea532764"

      - name: Set Azure Subscription
        run: |
          az account set \
           --subscription "0e3402ea-b30c-409a-9bbe-2dac4d43e202"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan